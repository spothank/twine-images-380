  <text x="340" y="88" text-anchor="middle" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="11" letter-spacing="0.18em" fill="#4B9CD3" style="fill:rgb(75, 156, 211);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">TAR HEEL VENTURES</text>

  <text x="340" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#13294B" style="fill:rgb(19, 41, 75);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:42px;font-weight:400;text-anchor:middle;dominant-baseline:auto">You win — this time.</text>

  <text x="340" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#999" style="fill:rgb(153, 153, 153);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:14px;font-weight:400;text-anchor:middle;dominant-baseline:auto">The calls that worked today might not work tomorrow.</text>
  <text x="340" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#999" style="fill:rgb(153, 153, 153);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:14px;font-weight:400;text-anchor:middle;dominant-baseline:auto">That's not a flaw in the game. That's the point.</text>

